<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Personal resume and portfolio website" />
  <title>Resume</title>

  <!-- Marseille-inspired serif fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- html2pdf.js for client-side PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="container" id="resume-root">

    <!-- HERO -->
    <header class="hero" id="hero">
      <h1 class="hero__name" id="hero-name"></h1>
      <nav class="hero__contact" id="hero-contact"></nav>
    </header>

    <!-- DOWNLOAD BUTTON -->
    <div class="download-btn-wrap">
      <button class="download-btn" id="download-pdf-btn" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download Resume as PDF
      </button>
    </div>

    <!-- SKILLS -->
    <section class="section" id="skills-section">
      <h2 class="section__title">Skills</h2>
      <div class="skills-grid" id="skills-grid"></div>
    </section>

    <!-- EDUCATION -->
    <section class="section" id="education-section">
      <h2 class="section__title">Education</h2>
      <div id="education-list"></div>
    </section>

    <!-- EXPERIENCE -->
    <section class="section" id="experience-section">
      <h2 class="section__title">Experience</h2>
      <div id="experience-list"></div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer__divider"></div>
      <p id="footer-text"></p>
    </footer>
  </div>

  <script src="index.js"></script>
</body>
</html>
